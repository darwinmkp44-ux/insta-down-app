# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Enable AndroidX packaging support
android.useAndroidX=true

# Enable non-transitive R classes to speed up builds
android.nonTransitiveRClass=true

# JVM arguments for the Gradle build daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style
kotlin.code.style=official

# Force Gradle to use JDK 21 for compatibility
org.gradle.java.home=/usr/local/sdkman/candidates/java/21.0.10-ms

